name: example
version: 0.1.0
description: Template module — copy to modules/<name>/ and customize (not walked by bridge)
triggers:
  - type: url_pattern
    pattern: "^https?://example\\.com/"
entry_point: extractor.py
preflight:
  entry_point: preflight.py
  timeout_seconds: 30
default_value_tier: routine
schema_examples: few-shot.md
source_id_from:
  example_sources: url
user_owned:
  - sources.yaml
extraction_timeout_seconds: 600


name: rss
version: 0.1.0
description: Generic RSS 2.0 and Atom feed extraction (newsletters, blogs, podcasts, academic)
triggers:
  - type: url_pattern
    pattern: "^https?://.+\\.(?:rss|atom)(?:\\?.*)?$"
  - type: url_pattern
    pattern: "^https?://.*/(?:feed|rss|atom)(?:/.*)?(?:\\?.*)?$"
entry_point: extractor.py
preflight:
  entry_point: preflight.py
  timeout_seconds: 30
default_value_tier: routine
default_tier: basic
schema_examples: few-shot.md
source_id_from:
  rss_feeds: url
user_owned:
  - sources.yaml
extraction_timeout_seconds: 180

authentication: none

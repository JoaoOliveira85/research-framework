name: Quality regression harness

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Optional — limit to one fixture (tech-lite | source-poor | source-rich); default = all'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - tech-lite
          - source-poor
          - source-rich

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality regression harness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run quality harness
        run: |
          ./build.sh --quality ${{ github.event_name == 'workflow_dispatch' && format('--fixture {0}', inputs.fixture) || '' }} --no-color

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ github.run_id }}
          path: _pipeline/quality/regression-report.json
          retention-days: 30

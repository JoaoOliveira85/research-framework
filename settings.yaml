# ===========================================================================
# research-framework global settings
# ===========================================================================
# These are the *defaults*. Every value can be overridden by a vault's
# research.spec.md (`settings:` block) — spec wins over file.
#
# The same file shape is copied into each generated vault so that the vault
# remains self-contained once the generator is deleted.
#
# Principle: keep this file short, opinionated, and fully commented. A user
# should be able to understand the entire pipeline by reading this file.
# ===========================================================================

schema_version: 1

# ---------------------------------------------------------------------------
# archived (spec 071) — freeze a finished vault.
#
# `true` refuses every research cycle: `./vault research` and
# `generate --resume` exit 2 before opening a branch or writing a run report.
# The guard lives in the orchestrator, so a stale shim, a cron entry or a
# direct script call is refused too.
#
# Read paths stay open — `ask`, `status`, `digest`, `health`, `audit`,
# `re-grade`, `wikilinks` — and the vault still takes framework upgrades via
# `./vault update`. Set back to false to resume research.
# ---------------------------------------------------------------------------
archived: false

# ---------------------------------------------------------------------------
# Vendor-agnostic model tiers (spec 020 D7). Stages reference tier names;
# the framework resolves them to concrete model identifiers at config-load.
# ---------------------------------------------------------------------------
tiers:
  basic: claude-haiku-4-5
  normal: claude-sonnet-5
  flagship: claude-opus-5

# Source modules installed into <vault>/modules/ (spec 020). Empty until
# the operator opts in; `./vault update` copies listed modules from the bundle.
modules: []

# ---------------------------------------------------------------------------
# Where generated vaults land.
#
# `output_dir` is consulted when the user runs `./generate.sh` (or `rv
# generate`) WITHOUT passing an explicit `--output <dir>` flag. It lets a
# user who only has one vault they care about set the destination once and
# then run the generator with zero arguments.
#
# Resolution rules:
#
#   - `null` (the default) — fall back to the spec file's own `location`
#     field (detailed spec) or `<spec-file-parent>/<spec.name>` (simple
#     spec). Backwards-compatible with pre-0.2.9 behaviour.
#   - Leading `~` is expanded to the user's home directory.
#   - `$ENV_VAR` / `${ENV_VAR}` are expanded.
#   - Absolute paths are used as-is.
#   - Relative paths are resolved against the parent directory of *this*
#     settings file, NOT the user's current working directory — that way a
#     settings.yaml committed next to a spec stays portable.
#
# CLI precedence: `--output` flag > `output_dir` here > spec location.
# ---------------------------------------------------------------------------
output_dir: null

# ---------------------------------------------------------------------------
# How agents talk to models.
# ---------------------------------------------------------------------------
communication:
  # "cli"  → spawn local CLI binaries (claude, codex, …) as subprocesses.
  # "api"  → call providers directly over HTTP (requires keys). NOT YET
  #          IMPLEMENTED; the orchestrator will error out if selected.
  mode: cli

# ---------------------------------------------------------------------------
# Default executor applied to any stage that does not override it.
# An executor is an *object*, not a string: it pairs a runtime with a model,
# a skill file, a timeout, and a failure policy. Stages pick up this default
# and then tweak only the fields they need (usually `model` and `skill`).
# ---------------------------------------------------------------------------
default_executor:
  type: cli             # cli | script | api
  runtime: claude       # binary on PATH; only used when type == cli
  model: sonnet         # friendly alias → resolved by the runtime
  skill: null           # filled in per stage
  timeout_s: 3600       # 1 hour — long enough for the hardest single call
  retry: 1              # number of retries on non-zero exit / API 5xx
  # ---------------------------------------------------------------------
  # Why bypassPermissions:
  #
  # speckit's contract IS the spec — `sources:`, `note_types:`,
  # `data_sources:` already declare what the agent is authorised to
  # read, fetch, and write. Re-asking the human for each Bash call,
  # WebFetch, or file edit during a non-interactive `--print` run is
  # both impossible (no human present) and redundant (the spec is the
  # authorisation). The codex profile already mirrors this with
  # `--sandbox workspace-write` — this is the claude equivalent.
  #
  # Set to `default` (or remove the args block) if you want per-call
  # confirmation; override at stage level for asymmetric trust.
  # ---------------------------------------------------------------------
  args:
    - --permission-mode
    - bypassPermissions
  on_fail: abort        # abort | skip | continue

# ---------------------------------------------------------------------------
# CG-001 minimum cycle-yield model (spec 051 FR1).
# target = base * cadence_factor * coverage_factor, clamped to [min_floor,
# max_ceiling]. Cadence is time-since-last-cycle (cold start → monthly);
# coverage is met/target ratio (<0.5 / 50-80 / >0.8). The gate WARNs below
# target and only FAILs below min_floor. Empirical re-tune of these defaults
# is tracked for 0.7.2 against _pipeline/yield-calibration.json.
# ---------------------------------------------------------------------------
cycle_yield:
  base_notes_per_cycle: 5
  cadence_factor:
    daily: 1.0
    weekly: 3.0
    biweekly: 5.0
    monthly: 8.0
  coverage_factor:
    coverage_below_50pct: 1.5
    coverage_50_to_80pct: 1.0
    coverage_above_80pct: 0.5
  min_floor: 1
  max_ceiling: 50

# ---------------------------------------------------------------------------
# Inbound-link-aware stub policy (spec 051 FR3).
# A short note with at least `anchor_link_threshold` inbound wikilinks is a
# graph anchor: it is flagged `needs-research` and surfaced in the backlog,
# never silently deleted. Orphaned short notes remain ordinary stub-removal
# candidates.
# ---------------------------------------------------------------------------
stubs:
  anchor_link_threshold: 5

# ---------------------------------------------------------------------------
# Pipeline-wide knobs that don't fit under a single stage.
# ---------------------------------------------------------------------------
pipeline:
  # B7 canonical loader required keys (spec 025 US9); tune per vault as needed.
  max_cycles: 20
  # Run-level CUMULATIVE dollar cap (spec 061 ladder; `--max-usd` overrides).
  #
  # `0` — or `0.0`, or an absent key — means UNLIMITED, never "spend nothing"
  # and never "ask before every spend" (spec 061 amendment, 2026-09-07). That
  # is now decided in the resolver itself rather than inferred from the
  # orchestrator's `cumulative >= budget_cap > 0` guard, so no reader can
  # disagree about it. Every shipped profile said `0.0` — i.e. no ceiling at
  # all — until issue #230.
  #
  # 25.00 ≈ five full cycles at the `limits:` per-cycle ceiling below: enough
  # for a real run, not enough for a runaway.
  budget_usd: 25.00

  # ---------------------------------------------------------------------
  # Auto-promotion threshold for orphan wikilinks.
  #
  # After every cycle, `topic_harvest.py` ranks every unresolved
  # `[[wikilink]]` by how many distinct existing notes cite it. Any
  # entry whose citation count meets or exceeds this threshold becomes
  # a new `CoverageCategory` in `_pipeline/coverage-targets.json` —
  # so the Phase 3 gate tracks emergent topology rather than just
  # spec-author foresight (constitution v1.3.0 § "Coverage Targets —
  # Dynamic extension via backlog promotion").
  #
  # Tuning:
  #   1   → every orphan becomes a target (rarely useful — produces noise
  #         from acronyms and casual name-drops)
  #   2   → default; balances noise filtering against capturing real
  #         emergent concepts the agent surfaces
  #   3+  → stricter; only orphans the vault's own notes converge on
  #   ∞   → set to a very high number to disable auto-promotion entirely
  # ---------------------------------------------------------------------
  backlog_promotion_threshold: 2

  # ---------------------------------------------------------------------
  # Feature 017 — vault quality fix.
  # All keys below have safe defaults that match the spec's Story 9
  # thresholds; tune per vault by overriding in the spec's `settings:`
  # block. The orchestrator reads these at cycle start.
  # ---------------------------------------------------------------------

  # Topics per note-writer invocation. Hard-clamped to [3, 10] by the
  # batch scheduler (R-004); values outside range log a WARN and clamp.
  note_writer_batch_size: 6

  # Safety net so a runaway batch loop can't burn the entire budget on
  # one cycle. WARN-and-stop on cap-trip; never FAILs the cycle.
  max_batches_per_cycle: 10

  # Mid-run source-failure thresholds (R-003). Required-source quorum
  # loss aborts the cycle (exit 2). Enrichment failures are unlimited
  # by default (0 = disabled cap). Set per-vault when a stricter
  # discipline is wanted (e.g. code-derived vaults: required_quorum_loss: 1).
  source_failure_thresholds:
    required_quorum_loss: 2
    enrichment_max_failures: 0

  # Queryability score regression band (R-002). Drops within this
  # tolerance are reported as `stable`; drops beyond are `regressing`
  # (WARN, not FAIL). 5pp is ~1.5x observed run-to-run agent variance.
  queryability_score_regression_pp: 5

  # Deterministic gate thresholds (spec Story 9). All gates produce
  # GateResult with PASS/WARN/FAIL/NA; the orchestrator uses these to
  # decide whether to retry the cycle (incremental, max 2 retries).
  gates:
    # SG (step gates) — run between scout/note-writer steps.
    sg_001_min_topics_warn_floor: 1     # < this → SG-001 FAIL
    sg_002_min_categories: 5            # min distinct categories in topics_found.new
    sg_003_abstraction_warn_pct: 20     # 20% < ratio ≤ warn_pct → WARN
    sg_003_abstraction_fail_pct: 60     # ratio > fail_pct → FAIL
    # SG-003 / CG-003 read spec.forbidden_filename_prefixes when the vault
    # declares any, else a framework starter set (svc_, tbl_, tmp_, …).
    # Set false to switch both abstraction gates off for this vault.
    abstraction_enabled: true
    # CG (cycle gates) — run after notes are written, before next cycle.
    cg_001_min_yield_factor: 1.0        # multiplier on ceil(remaining/remaining_cycles)
    cg_002_min_categories_per_cycle: 3  # cycle must touch ≥ this many categories
    cg_004_min_avg_word_count: 200      # falls back to per-note-type min_word_count when stricter
    cg_006_min_word_count_compliance_pct: 90  # ≥ this % of cycle's notes meet min_word_count
    cg_007_max_orphan_link_pct: 15      # ≤ this % of cycle's wikilinks unresolved at cycle end

# ---------------------------------------------------------------------------
# Per-stage executor overrides.
# Stage keys mirror the orchestrator's pipeline map:
#   1.x  install / pre-flight
#   2.x  per-cycle pre-processing
#   3.x  scout / research / verify / write-back
#   4.x  post-cycle analysis
#   5.x  user-facing read/write operations (ask/write)
#
# Fields left unset inherit from `default_executor`.
# ---------------------------------------------------------------------------
stages:
  # --- 1.x install / pre-flight ------------------------------------------
  install_wizard:
    model: sonnet       # conversational; needs follow-up questions
    skill: install-wizard

  vault_spec_author:
    model: sonnet
    skill: vault-spec

  # --- 2.x pre-processing ------------------------------------------------
  source_relevance:
    model: haiku        # cheap binary related/unrelated gate
    skill: source-relevance
    timeout_s: 300

  # --- 3.x scout / research / verify -------------------------------------
  scout:
    model: sonnet
    skill: scout

  topic_classifier:
    model: haiku
    skill: topic-classifier

  dfs_prompt_gen:
    model: sonnet       # router may upgrade to opus on complex topics
    skill: dfs-prompt-gen

  note_writer:
    model: sonnet       # router can upgrade per-topic
    skill: note-writer

  note_tagger:
    model: haiku
    skill: note-tagger

  verifier:
    enabled: true
    model: sonnet
    skill: verifier
    timeout_s: 600
    on_timeout: pending
    output_filename: "cycle-{cycle:03d}-verifier.json"

  source_manager:
    enabled: true
    decay_after_n_cycles: 3         # archive unlocked sources after N consecutive empty cycles
    auto_promote_discovered: false  # true = no confirmation prompt when promoting new sources

  # --- 2.x source-extraction (spec 020) ----------------------------------
  schema_gen:
    tier: basic
    enabled: true

  source_extraction:
    enabled: false                  # opt-in until 0.3.0 ship flip (FR-012)
    tier: basic
    signal_retention_days: 30
    consensus:
      tiers:
        routine: 1
        important: 3
        critical: 5

  # --- 3.9 end-of-cycle topic expansion (independent sub-stages) ---------
  # Phase 1 (`topic_harvest`) is a zero-cost deterministic script — it
  # always runs and has no settings here. Phase 2 (`topic_propose`) is an
  # optional agent stage that proposes scope-bounded tangents derived
  # from the notes just written this cycle. It is OFF by default so a
  # new vault stays predictable; flip `enabled: true` to turn it on.
  #
  # The two phases are fully independent: Phase 1 writes
  # `_pipeline/cycles/cycle-NNN-harvest.json` + a `topic-harvest` managed
  # block in `research-backlog.md`; Phase 2 writes
  # `cycle-NNN-propose.json` + a separate `topic-propose` block. You can
  # enable/disable or re-tune them without touching the other.
  #
  # See specs/003-topic-harvest-stage/phase-2-semantic.md.
  # --- 2.x research plan (feature 017 + spec 025 A1) ---------------------
  # Advisory ``## Focus rationale`` header; routed through agent_call.py.
  plan_narrator:
    tier: standard          # basic | standard | expert — metadata for cost sidecar

  # Probe-cache retrieval (spec 025 A2); routed through agent_call.py.
  probe_retrieval:
    tier: standard          # basic | standard | expert — metadata for cost sidecar
    # enabled defaults true; set false to skip LLM retrieval (cache-only path)

  topic_propose:
    enabled: false          # opt-in; default off for predictability
    model: haiku            # cheap relevance judgement, not deep reasoning
    skill: topic-propose
    timeout_s: 900
    # How many accepted proposals to surface per cycle. Extra candidates
    # are pushed to `rejected[]` with `rejected_by: cap_exceeded` so the
    # agent's output is fully recorded for audit.
    max_proposals: 10
    # How many hops from a touched note a proposal's parent may live.
    # 1 = parent was written/updated this cycle. 2 = parent is cited via
    # `[[…]]` from a touched note. Anything further is rejected.
    max_degree: 2
    # Closed enum — proposals that pick any other value are rejected
    # with `rejected_by: bad_relation`. Extend only when the existing
    # types genuinely can't capture a recurring case.
    relation_types:
      - variant
      - prerequisite
      - contrast
      - sibling
      - downstream_effect
      - user_question
    # What Phase 2 does when the spec has no `scope.out_of_scope`.
    #   skip  → emit an empty manifest and return (default; safest).
    #   warn  → proceed, tag every accepted proposal `scope_check: warn`.
    #   error → emit an empty manifest and flag the run's final report.
    on_missing_out_of_scope: skip
    # Auto-promote accepted proposals into the next cycle's scout as
    # explicit target_topics. Turn off to keep Phase 2 purely advisory
    # (proposals live in the backlog but the scout isn't forced to
    # consume them).
    auto_promote: true

  # --- 4.x post-cycle ----------------------------------------------------
  cycle_report:
    model: sonnet
    skill: cycle-report

  final_report:
    model: sonnet
    skill: final-report

  # --- 5.x ask / write ---------------------------------------------------
  ask_answer:
    model: sonnet
    skill: ask-answer

  doc_planner:
    model: sonnet
    skill: doc-planner

  doc_writer:
    model: sonnet       # router may upgrade to opus
    skill: doc-writer

  # --- Utility -----------------------------------------------------------
  model_router:
    model: haiku        # cheap dispatch decision
    skill: model-router

  default_update_spec:
    model: sonnet       # validates whether the implicit update spec still fits
    skill: default-update-spec

# ---------------------------------------------------------------------------
# Model router — when enabled, the router decides at runtime whether to
# upgrade a stage's executor (e.g. sonnet → opus) based on signals from the
# inputs. Stages that accept routing are listed below; anything not listed
# uses its static executor.
# ---------------------------------------------------------------------------
model_router:
  enabled: true
  eligible_stages:
    - dfs_prompt_gen
    - note_writer
    - doc_writer
    - ask_answer
  signals:
    - input_tokens         # more context → consider opus
    - source_count         # >10 sources → consider opus
    - cross_link_density   # dense wikilinking → consider opus
    - citation_density     # many tier-2 sources to reconcile → opus
    - topic_class          # "concept" or "decision" heavier than "reference"
    - complexity_flag      # user-supplied --complexity=high in ask/write
  upgrade_rules:
    # Very rough defaults; tuned by users per-vault.
    opus_if_tokens_over: 40000
    opus_if_sources_over: 10

# ---------------------------------------------------------------------------
# Research loop limits.
#
# The per-run cycle cap is the canonical `pipeline.max_cycles` (above) — spec
# 061. The deprecated `cycles.initial_max`/`update_max` seeds were REMOVED
# (they silently won over the spec in the rc1 codebase-vault run: 12 → 6). A
# vault that still carries them gets warn-and-honour ONLY when
# `pipeline.max_cycles` is absent; otherwise the canonical key wins + a WARNING.
# ---------------------------------------------------------------------------
cycles:
  # Verifier rejections that count as "stop trying"; exits the loop gracefully.
  max_consecutive_verifier_rejections:
    initial: 6
    update: 3

# ---------------------------------------------------------------------------
# Research mode defaults.
# Each run picks exactly one mode (auto-detected or `--mode`-overridden);
# every cycle inside the run inherits it. The spec can override per-vault;
# individual fields can also be overridden per-run by CLI flags.
#
# Mode semantics:
#   bootstrap → breadth-first scaffolding of a new vault; creates new notes.
#   refresh   → depth-first currency; only merges updates into existing
#               notes. New topics get deferred to `_pipeline/research-backlog.md`.
#   expand    → mixed: grows coverage AND refreshes. Ends with a tail-refresh
#               cycle when `auto_tail_refresh` is true.
#
# Auto-detection (when --mode is not supplied):
#   empty data_vault/   → bootstrap
#   non-empty, no spec scope drift → refresh
#   non-empty, scope widened or --mode expand → expand
# ---------------------------------------------------------------------------
research_modes:
  bootstrap:
    exit_condition: coverage_met          # gate against `coverage-targets.json`
    scout_bias: new_topics
    note_action: create                   # writer creates new notes
    wind_down:
      budget_pct_trigger: 0.8             # stop scouting when budget ≥80% spent
      zero_scout_cycles_trigger: 2        # …or after 2 cycles of zero new topics
      min_cycles_before_wind_down: 2      # never wind down before cycle 2

  refresh:
    exit_condition: no_new_deltas         # scout returns 0 deltas, verifier
                                          #    accepts 0 merges → terminate
    scout_bias: changes_since_snapshot    # uses `_pipeline/snapshots/` for diff
    note_action: merge                    # updates existing notes only
    new_topic_policy: backlog             # never write inline; defer to backlog
    # refresh never needs wind-down: it doesn't scout for new topics, so the
    # sprawl-without-substance failure mode doesn't apply.

  expand:
    exit_condition: coverage_met_or_no_deltas   # whichever fires last per pair
    scout_bias: both                            # new topics AND deltas each cycle
    note_action: create_or_merge
    budget_split:
      coverage_pct: 0.6                         # 60% of run budget for new notes
      refresh_pct: 0.4                          # 40% for merging deltas
    wind_down:
      budget_pct_trigger: 0.8
      zero_scout_cycles_trigger: 2
      min_cycles_before_wind_down: 2
    auto_tail_refresh: true                     # chain a final refresh cycle
                                                # so we never exit on a scout

# ---------------------------------------------------------------------------
# Exit invariant (applies to all modes).
# A note is a "stub" when any of the following is true:
#   • word_count < note_type.min_word_count
#   • source_urls is empty
#   • verifier status is `pending` or `rejected`
#   • frontmatter `status` is still `draft`
# No run may terminate while `stubs_remaining > 0`. The orchestrator either
# spends remaining budget resolving them or aborts with a report.
# ---------------------------------------------------------------------------
exit_invariant:
  block_on_stubs: true
  try_resolve_before_abort: true              # use leftover budget to fix stubs

# ---------------------------------------------------------------------------
# Budget guard rails (spec 033 `limits:`). These are the block the settings
# loader actually parses; the older top-level `budget:` block was never read
# by any code path and is gone (issue #230).
#
# Every limit here is opt-in BY ABSENCE — `budget_guard` skips a limit that is
# `null`, and the orchestrator's cumulative guard is `cumulative >=
# budget_cap > 0`, so a `0.0` reads as "uncapped". A shipped profile that left
# them unset therefore ran a weekly unattended vault with no ceiling at all.
# These seeds are RUNAWAY CEILINGS, not targets: a healthy cycle costs a
# fraction of them, and tripping one means something went wrong.
# ---------------------------------------------------------------------------
limits:
  # Per-cycle dollar cap, checked before every dispatch. Against
  # `dist-templates/cost-estimates.yaml` a full cycle (scout + plan + a few
  # note_writer batches + per-note verifier) sits near $2-3; $5 leaves
  # headroom for a heavy cycle and still stops a loop.
  cycle_budget_usd: 5.00
  # One soft WARN at this fraction of the cap (replaces `budget.warn_at_pct`).
  cycle_budget_warn_at: 0.8
  # Per-cycle wall-clock ceiling. The one guardrail that still bites when the
  # runtime is free (local models) or flat-rate.
  cycle_wallclock_budget_minutes: 90

# ---------------------------------------------------------------------------
# Commands exposed inside the generated vault. The keys are slash-command
# names (and script names) the vault will render; the values are the
# pipelines that back them. Users can rename keys to suit their taste
# (e.g. "research-framework" instead of "ask") without touching pipeline code.
# ---------------------------------------------------------------------------
commands:
  ask: ask_answer
  research: scout            # entry-point for the research loop
  write: doc_writer

# ---------------------------------------------------------------------------
# Citation / verifier policy (Principle IX).
# ---------------------------------------------------------------------------
citation:
  tier1_required: true       # every answer cites vault notes
  tier2_required: true       # those notes must themselves cite externals
  render_sections:
    tier1_heading: "Vault Sources"
    tier2_heading: "Original Sources"

# ---------------------------------------------------------------------------
# Rich vault reports + delivery (spec 040). All optional — unset ⇒ no delivery.
# PDF rendering requires: pip install research-framework[reports]
# SMTP credentials (when smtp.enabled): RF_SMTP_USER + RF_SMTP_PASSWORD env vars.
# Mirror copies audit-report, per-cycle reports, and _pipeline/digests/*.
# ---------------------------------------------------------------------------
reports:
  mirror:
    target: null              # e.g. /Users/me/iCloud Drive/vault-reports
  smtp:
    enabled: false
    recipient: null
    server: null
    port: 587
    from: null

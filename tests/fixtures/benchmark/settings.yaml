# Frozen settings for the spec-056 benchmark fixture vault.
# The harness overrides runtime + model per cell; these defaults only need to be
# a valid settings.yaml so agent_call.py can resolve a stage executor on the
# live path. The hermetic (--dry-run) path never reads a runtime from here.
pipeline:
  max_cycles: 1
  budget_usd: 5

default_executor:
  runtime: claude
  model: sonnet
  timeout_s: 600

stages:
  scout:
    model: sonnet
  note_writer:
    model: sonnet
  verifier:
    model: sonnet
